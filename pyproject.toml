[project]
name = "api-intercambio-vehiculos"
version = "0.1.0"
description = "API de solo lectura para intercambio de vehiculos (DGT-PROVIAL)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "django==6.0.6",
  "django-ninja==1.7.0",
  "psycopg[binary]==3.2.10",
  "gunicorn==23.0.0",
  "PyJWT[crypto]==2.10.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["configuracion*", "aplicaciones*", "base_de_datos*", "pruebas*"]
