# Ejemplo de tunel Cloudflare (sin puertos entrantes publicos).
# MODO LOCAL con credenciales: solo desarrollo/referencia. En PRODUCCION el
# tunel va gestionado remotamente por token (`TOKEN_TUNEL`, comando
# `tunnel --no-autoupdate run --token ...`), SIN este archivo: ver
# `despliegue/composicion_produccion.yaml` (servicio `tunel`).
# Copiar como base operativa; el identificador real va por gestor externo.
tunel: ${TUNEL_ID}
credenciales-archivo: /etc/cloudflared/credenciales.json

origen:
  # Hostname dedicado (confirmar en fase 0).
  - nombre-host: intercambio.provial.gob.gt
    servicio: http://nginx:80
  # Todo lo demas se rechaza en el borde.
  - servicio: http_status:404
