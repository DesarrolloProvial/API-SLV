# Nginx detras del tunel: segunda capa, solo trafico del tunel.
# Sin secretos ni datos personales en registros.

# Redacta la placa de la ruta antes de registrar.
map $uri $ruta_segura {
  ~^/api/v1/vehiculos/.*$  /api/v1/vehiculos/[redactado];
  default                  $uri;
}

# Zona de ritmo por cliente para `buscar` (tope a calibrar en convenio).
limit_req_zone $binary_remote_addr zone=buscar:10m rate=5r/s;

log_format intercambio_json escape=json
  '{"tiempo":"$time_iso8601","correlacion":"$http_x_codigo_correlacion",'
  '"metodo":"$request_method","ruta":"$ruta_segura","estado":$status,'
  '"bytes":$body_bytes_sent,"latencia":$request_time}';

upstream api {
  server api:8000;
}

server {
  listen 80;
  access_log /var/log/nginx/acceso.log intercambio_json;

  # Solo acepta trafico del tunel y la red interna.
  allow 127.0.0.1;
  allow 10.0.0.0/8;
  allow 172.16.0.0/12;
  allow 192.168.0.0/16;
  deny all;

  # Solo GET en la API; resto denegado con error uniforme.
  limit_except GET {
    deny all;
  }

  # Buscador con ritmo propio.
  location /api/v1/vehiculos/buscar {
    limit_req zone=buscar burst=10 nodelay;
    proxy_pass http://api;
    proxy_set_header X-Codigo-Correlacion $http_x_codigo_correlacion;
  }

  # Resto de la API de solo lectura.
  location /api/v1/vehiculos/ {
    proxy_pass http://api;
    proxy_set_header X-Codigo-Correlacion $http_x_codigo_correlacion;
  }

  # Salud solo red interna.
  location = /salud {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://api;
  }

  # Metricas solo red interna.
  location = /metricas {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    return 404;
  }
}
