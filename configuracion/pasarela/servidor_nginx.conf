# Nginx detras del tunel: segunda capa, solo trafico del tunel.
# Sin secretos ni datos personales en registros.

# Redacta la placa de la ruta antes de registrar.
map $uri $ruta_segura {
  ~^/api/v1/vehiculos/.*$  /api/v1/vehiculos/[redactado];
  default                  $uri;
}

# Zona de ritmo por cliente para `buscar` (tope a calibrar en convenio).
limit_req_zone $binary_remote_addr zone=buscar:10m rate=5r/s;

log_format intercambio_json escape=json
  '{"tiempo":"$time_iso8601","correlacion":"$http_x_codigo_correlacion",'
  '"metodo":"$request_method","ruta":"$ruta_segura","estado":$status,'
  '"bytes":$body_bytes_sent,"latencia":$request_time}';

upstream api {
  server api:8000;
}

server {
  # default_server: este bloque atiende todo el puerto 80 (el `default.conf`
  # de la imagen tambien escucha 80; sin esta marca el vhost por defecto
  # seria el de bienvenida y el tunel caeria ahi).
  listen 80 default_server;
  access_log /var/log/nginx/acceso.log intercambio_json;

  # Solo acepta trafico del tunel y la red interna.
  allow 127.0.0.1;
  allow 10.0.0.0/8;
  allow 172.16.0.0/12;
  allow 192.168.0.0/16;
  deny all;

  # Buscador con ritmo propio.
  # `limit_except` SOLO es valido dentro de `location` (no a nivel server).
  location /api/v1/vehiculos/buscar {
    limit_except GET {
      deny all;
    }
    limit_req zone=buscar burst=10 nodelay;
    proxy_pass http://api;
    proxy_set_header X-Codigo-Correlacion $http_x_codigo_correlacion;
  }

  # Resto de la API de solo lectura.
  location /api/v1/vehiculos/ {
    limit_except GET {
      deny all;
    }
    proxy_pass http://api;
    proxy_set_header X-Codigo-Correlacion $http_x_codigo_correlacion;
  }

  # Salud solo red interna.
  location = /salud {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://api;
  }

  # Metricas solo red interna (el API las expone sin token; el control
  # es la red: aqui se proxya solo en privada y la vista niega el resto).
  location = /metricas {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://api;
    proxy_set_header X-Codigo-Correlacion $http_x_codigo_correlacion;
  }

  # La especificacion abierta no sale por el borde (solo red interna
  # directa; la UI ya va en seco con `docs_url=None` en el API).
  location = /api/openapi.json {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://api;
  }
}
